version: '3.8'

services:
  server:
    build:
      context: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server/src:/app/src
    environment:
      - NODE_ENV=development
      - PORT=3000

  client:
    build:
      context: ./client
    ports:
      - "3001:3000"
    volumes:
      - ./client/src:/app/src
    environment:
      - NODE_ENV=development

  teacher-desktop:
    build:
      context: ./teacher-desktop
    ports:
      - "3002:3000"
    volumes:
      - ./teacher-desktop/src:/app/src
    environment:
      - NODE_ENV=development