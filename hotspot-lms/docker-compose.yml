services:
  ollama:
    image: ollama/ollama
    container_name: edulan-ollama
    volumes:
      - ./ai/ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  lms:
    build: ./server
    container_name: edulan-lms
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
      - ./server/static:/app/static
    depends_on:
      - ollama
    restart: unless-stopped
