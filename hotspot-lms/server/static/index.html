<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Hotspot LMS</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
    }
    .login-card {
      max-width: 400px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card login-card animate-in">
      <div class="text-center mb-lg">
        <h1 style="font-size: 1.75rem;">Hotspot LMS</h1>
        <p class="text-muted text-sm mt-xs">Silakan login untuk mengakses materi</p>
      </div>

      <form id="loginForm" class="flex flex-col gap-md">
        <div class="form-group">
          <label class="text-xs font-bold">Username</label>
          <input class="input" id="username" type="text" placeholder="Masukkan username" required />
        </div>
        <div class="form-group">
          <label class="text-xs font-bold">Password</label>
          <input class="input" id="password" type="password" placeholder="Masukkan password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full mt-md" id="loginBtn">Login</button>
      </form>

      <div id="errorMsg" class="text-danger text-sm text-center mt-md hidden"></div>

      <div class="mt-lg pt-lg text-center" style="border-top: 1px solid var(--border-subtle)">
        <p class="text-xs text-muted">Hubungi guru jika Anda lupa akun atau password</p>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    const user = JSON.parse(localStorage.getItem('hlms_user'));
    if (user) {
      window.location.href = user.role === 'teacher' ? '/teacher.html' : '/student.html';
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      loginBtn.innerText = 'Logging in...';
      loginBtn.disabled = true;
      errorMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('hlms_user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'teacher' ? '/teacher.html' : '/student.html';
        } else {
          errorMsg.innerText = data.error || 'Login gagal';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = 'Kesalahan koneksi';
        errorMsg.classList.remove('hidden');
      } finally {
        loginBtn.innerText = 'Login';
        loginBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
