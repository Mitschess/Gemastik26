<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Cepat | EduLAN</title>
  <script>!function(){var t=localStorage.getItem('edulan_theme'),d=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'))}();</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a href="/teacher.html" class="brand">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </span>
        <span>EduLAN Admin</span>
      </a>
      <div class="nav-links">
        <span id="themeToggleSlot"></span>
        <a href="/teacher.html" class="btn btn-sm btn-secondary">← Panel Guru</a>
      </div>
    </div>
  </nav>

  <main class="container" style="padding:28px 24px 48px">
    <div class="page-header">
      <div>
        <h1>Admin Cepat</h1>
        <p class="text-secondary">Kelola materi dan tugas secara langsung — alternatif sederhana dari panel guru.</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <section class="card">
        <div class="section-header">
          <div>
            <h2>Materi</h2>
            <p class="text-sm text-secondary">Tambah materi pembelajaran tanpa upload file.</p>
          </div>
        </div>
        <form id="materialForm" class="flex flex-col gap-md">
          <div class="form-group">
            <label for="matTitle">Judul</label>
            <input class="input" id="matTitle" placeholder="Contoh: Slide Bab 1" required />
          </div>
          <div class="form-group">
            <label for="matDesc">Deskripsi</label>
            <textarea class="textarea" id="matDesc" rows="3" placeholder="Ringkasan materi..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Buat Materi</button>
        </form>
        <div id="materialsList" class="mt-lg"></div>
      </section>

      <section class="card">
        <div class="section-header">
          <div>
            <h2>Tugas</h2>
            <p class="text-sm text-secondary">Buat tugas lalu tambahkan pertanyaan.</p>
          </div>
        </div>
        <form id="assignForm" class="flex flex-col gap-md">
          <div class="form-group">
            <label for="assignTitle">Judul</label>
            <input class="input" id="assignTitle" placeholder="Contoh: Tugas 1" required />
          </div>
          <div class="form-group">
            <label for="assignDesc">Deskripsi</label>
            <textarea class="textarea" id="assignDesc" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="assignDue">Batas Waktu (ISO)</label>
            <input class="input" id="assignDue" placeholder="2026-06-10T23:59:00Z" />
          </div>
          <button type="submit" class="btn btn-primary">Buat Tugas</button>
        </form>
        <div id="assignList" class="mt-lg assignment-list"></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="qmodal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="qmodalTitle">Tambah Pertanyaan</h3>
        <button class="icon-btn" id="qclose">✕</button>
      </div>
      <div class="flex flex-col gap-md mt-md">
        <div class="form-group">
          <label for="qtype">Tipe</label>
          <select class="select" id="qtype">
            <option value="mcq">Pilihan Ganda</option>
            <option value="essay">Essay</option>
          </select>
        </div>
        <div class="form-group">
          <label for="qprompt">Pertanyaan</label>
          <textarea class="textarea" id="qprompt" rows="3"></textarea>
        </div>
        <div class="form-group" id="choicesLabel">
          <label for="qchoices">Pilihan (pisahkan koma)</label>
          <input class="input" id="qchoices" placeholder="A, B, C, D" />
        </div>
        <div class="form-group">
          <label for="qanswer">Kunci Jawaban</label>
          <input class="input" id="qanswer" placeholder="Teks pilihan yang benar (MCQ)" />
        </div>
        <button class="btn btn-primary w-full" id="qadd">Tambah Pertanyaan</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    initThemeToggle(document.getElementById('themeToggleSlot'));

    async function loadMaterials() {
      setContainerLoading('materialsList', true, 2);
      try {
        const list = await fetch('/api/materials').then(r => r.json());
        const el = document.getElementById('materialsList');
        if (!list.length) {
          el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📖</div><p>Belum ada materi.</p></div>';
          return;
        }
        el.innerHTML = list.map(m => `
          <div class="mini-row mb-sm" style="cursor:default">
            <span><strong>${escapeHtml(m.title)}</strong><small>${escapeHtml(m.description || '')}</small></span>
            <button class="btn btn-sm btn-danger delMat" data-id="${m.id}">Hapus</button>
          </div>
        `).join('');
        document.querySelectorAll('.delMat').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('Hapus materi ini?')) return;
          await fetch('/api/materials/' + b.dataset.id, { method: 'DELETE' });
          showToast('Materi dihapus', 'success');
          loadMaterials();
        }));
      } catch {
        showToast('Gagal memuat materi', 'error');
      }
    }

    async function loadAssignments() {
      setContainerLoading('assignList', true, 2);
      try {
        const list = await fetch('/api/assignments').then(r => r.json());
        const el = document.getElementById('assignList');
        if (!list.length) {
          el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><p>Belum ada tugas.</p></div>';
          return;
        }
        el.innerHTML = list.map(a => {
          const qs = (a.questions || []).map(q => `
            <div class="question-summary-row">
              <span>${escapeHtml(q.prompt)}</span>
              <button class="btn btn-sm btn-danger delQ" data-a="${a.id}" data-q="${q.id}">Hapus</button>
            </div>
          `).join('');
          return `
            <div class="card card-flat" style="background:var(--bg-primary);padding:16px">
              <div class="flex justify-between items-start gap-md responsive-row">
                <div>
                  <strong>${escapeHtml(a.title)}</strong>
                  <p class="text-xs text-muted mt-xs">Deadline: ${escapeHtml(a.dueDate || '—')}</p>
                  <p class="text-sm text-secondary mt-xs">${escapeHtml(a.description || '')}</p>
                </div>
                <div class="flex gap-sm wrap-row">
                  <button class="btn btn-sm btn-secondary addQ" data-id="${a.id}">+ Soal</button>
                  <button class="btn btn-sm btn-danger delA" data-id="${a.id}">Hapus</button>
                </div>
              </div>
              ${qs ? `<div class="question-summary mt-sm">${qs}</div>` : '<p class="text-xs text-muted mt-sm">Belum ada pertanyaan.</p>'}
            </div>
          `;
        }).join('');

        document.querySelectorAll('.addQ').forEach(b => b.addEventListener('click', () => openQModal(b.dataset.id)));
        document.querySelectorAll('.delA').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('Hapus tugas ini?')) return;
          await fetch('/api/assignments/' + b.dataset.id, { method: 'DELETE' });
          showToast('Tugas dihapus', 'success');
          loadAssignments();
        }));
        document.querySelectorAll('.delQ').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('Hapus pertanyaan ini?')) return;
          await fetch(`/api/assignments/${b.dataset.a}/questions/${b.dataset.q}`, { method: 'DELETE' });
          showToast('Pertanyaan dihapus', 'success');
          loadAssignments();
        }));
      } catch {
        showToast('Gagal memuat tugas', 'error');
      }
    }

    document.getElementById('materialForm').addEventListener('submit', async e => {
      e.preventDefault();
      const title = document.getElementById('matTitle').value.trim();
      const desc = document.getElementById('matDesc').value.trim();
      if (!title) return showToast('Judul wajib diisi', 'error');
      await fetch('/api/materials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, description: desc }) });
      e.target.reset();
      showToast('Materi berhasil dibuat', 'success');
      loadMaterials();
    });

    document.getElementById('assignForm').addEventListener('submit', async e => {
      e.preventDefault();
      const title = document.getElementById('assignTitle').value.trim();
      const desc = document.getElementById('assignDesc').value.trim();
      const due = document.getElementById('assignDue').value.trim();
      if (!title) return showToast('Judul wajib diisi', 'error');
      await fetch('/api/assignments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, description: desc, dueDate: due }) });
      e.target.reset();
      showToast('Tugas berhasil dibuat', 'success');
      loadAssignments();
    });

    let currentAssignId = null;
    function openQModal(assignId) {
      currentAssignId = assignId;
      document.getElementById('qmodalTitle').textContent = 'Tambah pertanyaan';
      document.getElementById('qmodal').classList.add('show');
    }

    document.getElementById('qclose').onclick = () => document.getElementById('qmodal').classList.remove('show');
    document.getElementById('qtype').onchange = e => {
      document.getElementById('choicesLabel').classList.toggle('hidden', e.target.value !== 'mcq');
    };

    document.getElementById('qadd').onclick = async () => {
      const type = document.getElementById('qtype').value;
      const prompt = document.getElementById('qprompt').value.trim();
      const choicesRaw = document.getElementById('qchoices').value.trim();
      const answer = document.getElementById('qanswer').value.trim();
      if (!prompt) return showToast('Pertanyaan wajib diisi', 'error');
      const payload = { type, prompt };
      if (type === 'mcq') payload.choices = choicesRaw.split(',').map(s => s.trim()).filter(Boolean);
      if (answer) payload.answer = answer;
      await fetch(`/api/assignments/${currentAssignId}/questions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('qmodal').classList.remove('show');
      document.getElementById('qprompt').value = '';
      document.getElementById('qchoices').value = '';
      document.getElementById('qanswer').value = '';
      showToast('Pertanyaan ditambahkan', 'success');
      loadAssignments();
    };

    loadMaterials();
    loadAssignments();
  </script>
</body>
</html>
